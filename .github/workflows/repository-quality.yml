name: Verify repository and commit message
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check newly introduced commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            commits=$(git rev-list "$PR_BASE..$PR_HEAD")
          elif [[ "$EVENT_NAME" == "push" && -n "$PREVIOUS" && "$PREVIOUS" != "0000000000000000000000000000000000000000" ]]; then
            commits=$(git rev-list "$PREVIOUS..HEAD")
          else
            commits=$(git rev-list -n 1 HEAD)
          fi
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            msg=$(git log -1 --format=%s "$sha")
            if [[ "$msg" != "attack by Lam" ]]; then
              echo "::error::Commit $sha must use exactly: attack by Lam"
              exit 1
            fi
          done <<< "$commits"
          echo "All checked commit subjects are valid."
      - name: Check README and application metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          readme=Path('README.md')
          assert readme.is_file()
          content=readme.read_text(encoding='utf-8')
          assert "https://github.com/lamberthrumpaidus/lamberthrumpaidus" in content
          for rel in re.findall(r'<img\s+src="\./([^"]+)"', content):
              assert Path(rel).is_file(),f"README image missing: {rel}"
          site=Path('index.html')
          if site.exists():
              html=site.read_text(encoding='utf-8')
              assert re.search(r'<title[^>]*>.*?</title>',html,re.I|re.S)
              assert re.search(r'<html\b[^>]*\blang=',html,re.I)
              assert "ALL Create by LamberthRumpaidus" in html
              assert re.search(r'<meta\b[^>]*\bname=["\']description["\']',html,re.I)
          package=Path('package.json')
          if package.exists():
              json.loads(package.read_text(encoding='utf-8'))
          print("README, local branding and entry points validated.")
          PY

      - name: Verify generated runtime and JavaScript
        run: |
          python3 tools/build.py
          git diff --exit-code -- src/js/runtime/game.js
          node --check src/js/runtime/game.js
          node --check sw.js
          node --check src/js/platform/offline.js
          node --check src/js/platform/SaveStore.js
          node --check src/js/audio/soundscape.js
          node --check src/js/engine/CinematicPipeline.js
          node --check src/js/engine/MaterialLibrary.js
          node --check src/js/engine/BossModels.js
          node --check src/js/engine/ParticleBatch.js
          node --check src/js/engine/EnemyModels.js
          node --check src/js/ui/MapProjection.js
          node --check src/js/ui/WorldAtlas.js
          node --check src/js/engine/CombatRules.js
          node --check src/js/engine/RealmArt.js
          node --check src/js/engine/FrameProfiler.js
          node --check src/js/engine/MeshBudget.js
          node --check src/js/engine/HeroRig.js
          node --check src/js/engine/HeroArmor.js
          node --check src/js/engine/EnemyMotion.js
          node --test tests/geometry.test.cjs tests/atlas.test.cjs tests/combat.test.cjs tests/perf.test.cjs tests/mesh.test.cjs tests/rig.test.cjs tests/enemy-motion.test.cjs
      - name: Exercise actual game in preinstalled Chrome
        run: python3 tests/browser_smoke.py
      - name: Publish real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landlord-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  preview:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual game animation at controlled simulation intervals
        run: python3 tests/animation_preview.py
      - name: Package playable static build
        run: python3 tools/package_preview.py
      - name: Publish animation frames and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landlord-animation-preview
          path: animation-preview/
          if-no-files-found: ignore
      - name: Publish playable preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: landlord-playable-preview
          path: preview-dist/LANDLORD-playable-preview.zip
          if-no-files-found: error
